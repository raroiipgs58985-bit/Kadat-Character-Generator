name: Apply xeno generator

on:
  push:
    branches:
      - agent/xeno-generator
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xeno-generator

      - name: Apply xeno files
        shell: bash
        run: |
          set -euo pipefail
          cat .xeno-bundle/part-* | base64 -d > /tmp/xeno.tar.gz
          tar -xzf /tmp/xeno.tar.gz
          mv tests-xeno-engine.cjs tests/xeno-engine-check.cjs

          python - <<'PATCH'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          css = '<link rel="stylesheet" href="regiment-character-link.css?v=1.3.4">'
          if 'xeno-mode.css' not in index:
              index = index.replace(css, css + '\n  <link rel="stylesheet" href="xeno-mode.css?v=1.4.0">', 1)

          data = '<script src="data.js?v=1.1.3"></script>'
          if 'xeno-data.js' not in index:
              index = index.replace(data, data + '\n  <script src="xeno-data.js?v=1.4.0"></script>\n  <script src="xeno-engine.js?v=1.4.0"></script>', 1)

          end = '  <script src="regiment-character-link-loader.js?v=1.3.4"></script>'
          if 'xeno-mode.js?v=1.4.0' not in index:
              index = index.replace(end, end + '\n  <script src="xeno-character-link.js?v=1.4.0"></script>\n  <script src="xeno-mode.js?v=1.4.0"></script>', 1)

          index = index.replace('COGITATOR V 1.3.4', 'COGITATOR V 1.4.0')
          index_path.write_text(index, encoding='utf-8')

          check_path = Path('.github/workflows/check.yml')
          check = check_path.read_text(encoding='utf-8')
          marker = '      - name: Check regiment-character link\n        run: node tests/regiment-character-link-check.mjs\n'
          if 'Check xeno generator' not in check:
              check = check.replace(marker, marker + '\n      - name: Check xeno generator\n        run: node tests/xeno-engine-check.cjs\n', 1)
          check_path.write_text(check, encoding='utf-8')
          PATCH

          node --check xeno-data.js
          node --check xeno-engine.js
          node --check xeno-mode.js
          node --check xeno-character-link.js
          node tests/xeno-engine-check.cjs

          git add xeno-data.js xeno-engine.js xeno-mode.js xeno-character-link.js xeno-mode.css tests/xeno-engine-check.cjs index.html .github/workflows/check.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Добавить генератор ксеносов'
          git push origin HEAD:agent/xeno-generator
