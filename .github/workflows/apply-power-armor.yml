name: Apply power armor generator

on:
  push:
    branches:
      - agent/power-armor-generator

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/power-armor-generator
      - name: Wire generator into page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if 'power-armor-mode.css' not in text:
              text = text.replace(
                  '<link rel="stylesheet" href="xeno-mode.css?v=1.4.0">',
                  '<link rel="stylesheet" href="xeno-mode.css?v=1.4.0">\n  <link rel="stylesheet" href="power-armor-mode.css?v=1.5.0">'
              )
          if 'power-armor-data.js' not in text:
              text = text.replace(
                  '  <script src="xeno-mode.js?v=1.4.0"></script>',
                  '  <script src="xeno-mode.js?v=1.4.0"></script>\n  <script src="power-armor-data.js?v=1.5.0"></script>\n  <script src="power-armor-engine.js?v=1.5.0"></script>\n  <script src="power-armor-mode.js?v=1.5.0"></script>'
              )
          text = text.replace('COGITATOR V 1.4.1', 'COGITATOR V 1.5.0')
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/check.yml')
          check = workflow.read_text(encoding='utf-8')
          marker = '      - name: Check referenced local assets\n'
          block = '      - name: Check power armor generator\n        run: node tests/power-armor-engine-check.cjs\n\n'
          if 'Check power armor generator' not in check:
              check = check.replace(marker, block + marker)
          workflow.write_text(check, encoding='utf-8')
          PY

          git add index.html .github/workflows/check.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Подключить режим серво-брони версии 1.5.0'
          git push origin HEAD:agent/power-armor-generator
