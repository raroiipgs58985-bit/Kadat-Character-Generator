name: Apply advancement version

on:
  push:
    branches:
      - agent/fix-advancement-choice-refresh

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-advancement-choice-refresh

      - name: Bump cache version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace('advancement-runtime.js?v=1.1.3', 'advancement-runtime.js?v=1.4.1')
          text = text.replace('COGITATOR V 1.4.0', 'COGITATOR V 1.4.1')
          path.write_text(text, encoding="utf-8")
          PY

          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Обновить версию когитатора до 1.4.1'
          git push origin HEAD:agent/fix-advancement-choice-refresh
